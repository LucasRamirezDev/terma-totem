<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/icono-terma.png" />
  <link rel="apple-touch-icon" href="/icono-terma.png" />
  <title>TERMA · Panel de control</title>
  <style>
    body {
      margin: 0;
      background: #0a1114;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #0a1114;
      color: #f3f8f9;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .splash-logo {
      width: clamp(100px, 22vw, 150px);
      height: clamp(100px, 22vw, 150px);
      object-fit: contain;
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(24, 215, 169, 0.25);
      margin-bottom: 20px;
      animation: pulseLogo 2s infinite ease-in-out;
    }
    .splash-title {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      color: #2ce2b1;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: clamp(13px, 2.2vw, 16px);
      color: #95b2b0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(24, 215, 169, 0.2)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(24, 215, 169, 0.4)); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-container">
      <img src="/icono-terma.png" alt="TERMA" class="splash-logo" />
      <div class="splash-title">TERMA</div>
      <div class="splash-subtitle">Climatización para tus cultivos</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
